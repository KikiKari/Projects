name: Abstraktionen

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      prioritaet:
        description: "Zu bearbeitende Stufe"
        type: choice
        options: [reihum, high, medium, low, alle]
        default: reihum
      anzahl:
        description: "Hoechstzahl Quelldateien in diesem Lauf"
        default: "40"

concurrency:
  group: abstraktionen
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  statuses: read

jobs:
  uebersetzen:
    name: Quellcode direkt portieren
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ABSTRACTIONS_WORKSPACE: ${{ github.workspace }}/arbeit
      GITHUB_TOKEN: ${{ github.token }}
      RUNNER_COMPONENTS: ${{ github.workspace }}/runner/abstractions/runtime
      RUNNER_OUTPUT: ${{ github.workspace }}/output
      MANAGER_PATH: ${{ github.workspace }}/manager/skills/script-abstractions-manager/scripts/ABSTRACTIONS_MANAGER.py
      BATCH_DIR: ${{ github.workspace }}/.abstractions-gateway-batch
    steps:
      - name: Runner-Code auschecken
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: runner
          persist-credentials: false
      - name: Ausgabezweig auschecken
        uses: actions/checkout@v6
        with:
          ref: abstractions
          path: output
          fetch-depth: 0
      - name: Aktuellen Gateway-Manager auschecken
        shell: bash
        run: |
          set -eu
          git init "$RUNNER_TEMP/gateway-manager-git"
          git -C "$RUNNER_TEMP/gateway-manager-git" fetch --depth=1 https://github.com/KikiKari/OpenClaw.git refs/heads/gateway1
          mkdir -p "$(dirname "$MANAGER_PATH")"
          git -C "$RUNNER_TEMP/gateway-manager-git" show FETCH_HEAD:skills/script-abstractions-manager/scripts/ABSTRACTIONS_MANAGER.py > "$MANAGER_PATH"
      - name: Python bereitstellen
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pruefwerkzeuge und Grammatiken bereitstellen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcl perl ruby lua5.4 raku libfile-slurp-perl libfile-slurper-perl >/dev/null
          python3 -m pip install 'cryptography==46.0.5' 'tree-sitter-language-pack==1.25.2'
          python3 -c 'from tree_sitter_language_pack import prefetch; prefetch(["java", "c", "cpp", "php", "fsharp", "css"])'
      - name: Zustand und Quellspiegel wiederherstellen
        uses: actions/cache/restore@v6
        with:
          path: |
            arbeit/db
            arbeit/git/quellen
          key: abstraktionen-gateway-${{ github.run_id }}
          restore-keys: |
            abstraktionen-source-
            abstraktionen-gateway-
      - name: Gateway-Auftrag vorbereiten
        env:
          PRIORITY: ${{ inputs.prioritaet || 'reihum' }}
          SOURCE_COUNT: ${{ inputs.anzahl || '40' }}
        run: |
          python3 "$RUNNER_COMPONENTS/runner_manager.py" prepare \
            --manager "$MANAGER_PATH" --output-root "$RUNNER_OUTPUT" --directory "$BATCH_DIR" \
            --priority "$PRIORITY" --count "$SOURCE_COUNT"
      - name: Quellspiegel fuer weitere Laeufe sichern
        uses: actions/cache/save@v6
        with:
          path: |
            arbeit/db
            arbeit/git/quellen
          key: abstraktionen-source-prep-${{ github.run_id }}
      - name: Quellenindex fuer Observer bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-source-index-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.abstractions-gateway-batch/source-index.json
          if-no-files-found: error
          retention-days: 1
      - name: Quellen direkt portieren
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 "$RUNNER_COMPONENTS/runner_direct.py" --manager "$MANAGER_PATH" --output-root "$RUNNER_OUTPUT" --directory "$BATCH_DIR"
      - name: Gepruefte Uebersetzungen veroeffentlichen
        run: |
          git -C "$RUNNER_OUTPUT" config user.name "KikiKari"
          git -C "$RUNNER_OUTPUT" config user.email "272986081+KikiKari@users.noreply.github.com"
          for lang in javascript perl5 powershell python shell tcl perl6 ruby lua go java c cpp php fsharp css; do
            if [ -d "$RUNNER_OUTPUT/$lang" ]; then git -C "$RUNNER_OUTPUT" add -- "$lang"; fi
          done
          if git -C "$RUNNER_OUTPUT" diff --cached --quiet; then
            echo '::error::Der Lauf hat keinen neuen Ausgabecommit erzeugt.'
            exit 1
          fi
          git -C "$RUNNER_OUTPUT" commit -m 'Publish gateway translations'
          git -C "$RUNNER_OUTPUT" push origin HEAD:refs/heads/abstractions
      - name: Zustand nach Ergebnissen sichern
        uses: actions/cache/save@v6
        with:
          path: |
            arbeit/db
            arbeit/git/quellen
          key: abstraktionen-source-result-${{ github.run_id }}
