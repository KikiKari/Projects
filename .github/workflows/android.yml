name: Android

on:
  push:
    branches:
      - TikTok-Live-Companion-Android
    paths:
      - ".github/workflows/android.yml"
      - "mobile/android/**"
      - "mobile-shared/**"
      - "plugin-source/scripts/test_mobile_projects.py"
  workflow_dispatch:

jobs:
  test-and-package:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate shared mobile contracts
        run: python plugin-source/scripts/test_mobile_projects.py

      - name: Run mock debug unit tests
        id: unit_tests
        continue-on-error: true
        working-directory: mobile/android
        run: ./gradlew --no-daemon testMockDebugUnitTest

      - name: Build mock debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleMockDebug

      - name: Upload mock debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Live-Companion-Android-0.7.1-alpha-mock-debug
          path: mobile/android/app/build/outputs/apk/mock/debug/*.apk
          if-no-files-found: error

      - name: Preserve Android structure-test gate
        if: steps.unit_tests.outcome != 'success'
        run: |
          echo "The known Android structure-test gate remains open under 0PE-94." >&2
          exit 1

  promote-existing-apk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: TikTok-Live-Companion-Android-0.7.1-alpha-mock-debug
          path: release-asset
          run-id: 30748539909
          github-token: ${{ github.token }}

      - name: Normalize release asset name
        run: mv release-asset/app-mock-debug.apk release-asset/tiktok-live-companion-android-0.7.1.apk

      - name: Upload APK to existing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload tlc-android-v0.7.1-alpha release-asset/tiktok-live-companion-android-0.7.1.apk --clobber
