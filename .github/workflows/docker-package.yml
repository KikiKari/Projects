# Baut das Container-Abbild und veroeffentlicht es als Package auf ghcr.io.
#
# Runner: standardmaessig ein GitHub-Runner. Ueber "Run workflow" laesst sich
# stattdessen der eigene Rechner waehlen (self-hosted, Label lenovo-node7) —
# dann bleiben Build und Cache im Tailnet.
#
# Die Verteilung auf einen Tailnet-Node ist ausdruecklich abzuschalten und
# laeuft nur, wenn sie beim manuellen Start angefordert wird.

name: Docker Package

on:
  push:
    branches: ["MCP-Server-Monitor"]
    paths:
      - "Dockerfile"
      - "compose.yaml"
      - ".github/workflows/docker-package.yml"
      - "mcp-server-monitor/**"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      runner:
        description: "Wo bauen"
        type: choice
        default: "ubuntu-latest"
        options: ["ubuntu-latest", "self-hosted"]
      verteilen:
        description: "Nach dem Push auf einen Tailnet-Node ausrollen"
        type: boolean
        default: false

concurrency:
  group: docker-mcp-server-monitor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  bauen:
    name: Abbild bauen und veroeffentlichen
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    outputs:
      abbild: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Quellstand holen
        uses: actions/checkout@v4

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An ghcr.io anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Marken und Beschriftungen ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mcp-server-monitor
          tags: |
            type=raw,value=alpha,enable=${{ github.event_name != 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=ref,event=tag
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=mcp-server-monitor
            org.opencontainers.image.description=Diagnose fremder MCP-Server, lokale Weboberflaeche

      - name: Bauen und schieben
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Zusammenfassung
        run: |
          echo "### mcp-server-monitor" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  ausrollen:
    name: Auf lenovo-node7 starten
    needs: bauen
    if: github.event_name == 'workflow_dispatch' && inputs.verteilen
    # Der Runner laeuft auf lenovo-node7 und bedient die dortige
    # Docker-Desktop-Installation direkt. Er steht bereits im Tailnet —
    # deshalb braucht es hier weder tailscale/github-action noch OAuth-Secrets.
    runs-on: [self-hosted, lenovo-node7]
    steps:
      - name: Quellstand holen
        uses: actions/checkout@v4

      - name: An ghcr.io anmelden
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Abbild ziehen und dauerhaft starten
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
          docker compose ps

      - name: Zustand festhalten
        run: |
          echo "### mcp-server-monitor auf lenovo-node7" >> "$GITHUB_STEP_SUMMARY"
          docker compose ps >> "$GITHUB_STEP_SUMMARY"
