name: Promote Android release asset

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing Android Actions run containing the verified APK
        required: true
        type: string
      release_tag:
        description: Existing prerelease tag to update
        required: true
        default: tlc-android-v0.7.1-alpha
        type: string

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: TikTok-Live-Companion-Android-0.7.1-alpha-mock-debug
          path: release-asset
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Normalize release asset name
        run: mv release-asset/app-mock-debug.apk release-asset/tiktok-live-companion-android-0.7.1.apk

      - name: Upload APK to existing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" release-asset/tiktok-live-companion-android-0.7.1.apk --clobber
