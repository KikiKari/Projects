# Portiert den Quellcode aller drei Repositories in sechs Zielsprachen
#
#   docker compose up -d --build     starten (und nach Aenderungen neu bauen)
#   docker compose logs -f           zusehen
#   docker compose down              anhalten
#
# Eigener Projektname, eigener Container, eigenes Abbild, eigenes Volume:
# nichts davon beruehrt bestehende Umgebungen wie tlc, telegram-monitor
# oder onboardingandprojectpages.

name: abstractions-manager

services:
  app:
    build: .
    image: ghcr.io/kikikari/abstractions-manager:local
    container_name: abstractions-manager

    volumes:
      - abstractions-state:/home/openclaw/.openclaw/workspace

    environment:
      TZ: Europe/Berlin
      # Takt des Abgleichs mit Projects@abstractions, in Sekunden.
      ABGLEICH_TAKT: "43200"
      # Nur noetig, wenn im Container von Hand portiert werden soll. Der
      # planmaessige Lauf findet in GitHub Actions statt.
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"

    # Startet nach Neustart und nach Absturz wieder — aber nicht, wenn du
    # ihn selbst angehalten hast.
    restart: unless-stopped

    # Ein Beobachter braucht keine erweiterten Rechte.
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  abstractions-state:
